[project]
name = "radar"
version = "0.1.0"
description = "Data pipeline of the RADAR project: reproducible LLM-based extraction of decision criteria and their salience weights from online discussions (YouTube, Reddit) as a basis for multi-criteria decision analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jlnzll", email = "249779164+jlnzll@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "hdbscan>=0.8.44",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.6",
    "torch>=2.15.0",
    "umap-learn>=0.6.0",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
